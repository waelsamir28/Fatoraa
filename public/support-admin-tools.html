<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>FATORA — أداة التحكم بالتراخيص والأجهزة</title>
  <style>
    * { box-sizing: border-box; font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: #0b192c; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; }
    header {
      background: linear-gradient(90deg, #0f2942 0%, #0067c0 100%);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid #2fb3a6; box-shadow: 0 4px 20px rgba(0,0,0,.35);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 900; color: #fff; }
    header span { font-size: 11px; color: #bae6fd; font-weight: 700; }
    main { flex: 1; padding: 18px; max-width: 1060px; width: 100%; margin: 0 auto; }
    .conn-bar {
      display: grid; grid-template-columns: 1fr 240px auto; gap: 10px;
      background: #11223a; padding: 12px; border-radius: 12px; border: 1px solid #1e3a5f; margin-bottom: 14px;
    }
    input {
      height: 36px; border-radius: 8px; border: 1px solid #2b4c7e; background: #091526;
      color: #fff; padding: 0 12px; font-size: 12.5px; outline: none;
    }
    input:focus { border-color: #2fb3a6; }
    .btn {
      height: 36px; padding: 0 16px; border: 0; border-radius: 8px; font-weight: 800;
      font-size: 12.5px; cursor: pointer; color: #fff; background: #0067c0;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-green { background: #0f7b0f; }
    .btn-red { background: #c42b1c; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { padding: 8px 18px; border-radius: 8px; background: #11223a; color: #94a3b8; border: 1px solid #1e3a5f; cursor: pointer; font-weight: 800; font-size: 13px; }
    .tab.active { background: #0067c0; color: #fff; border-color: #38bdf8; }
    .panel { background: #11223a; border: 1px solid #1e3a5f; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { background: #0c1a2e; color: #93c5fd; padding: 10px; text-align: right; font-weight: 800; }
    td { padding: 9px 10px; border-top: 1px solid #1e3a5f; }
    .badge { padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; }
    .badge-on { background: #064e3b; color: #6ee7b7; }
    .badge-off { background: #7f1d1d; color: #fca5a5; }
    footer {
      background: #081220; border-top: 1px solid #1e3a5f; padding: 8px 20px;
      display: flex; justify-content: space-between; font-size: 11px; color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>FATORA — أداة التحكم بالتراخيص والأجهزة</h1>
      <span>تحكم مباشر عن بُعد عبر API بدون فتح الموقع</span>
    </div>
    <span id="status">غير متصل</span>
  </header>

  <main>
    <div class="conn-bar">
      <input id="base-url" type="url" value="https://fatoraa-seven.vercel.app" dir="ltr" placeholder="رابط الموقع" />
      <input id="api-key" type="password" value="FATORA-SUPPORT-2026" dir="ltr" placeholder="مفتاح الدعم الفني" />
      <button class="btn btn-green" onclick="loadData()">اتصال وتحديث</button>
    </div>

    <div class="tabs">
      <button class="tab active" id="t-dev" onclick="showTab('dev')">الأجهزة (<span id="c-dev">0</span>)</button>
      <button class="tab" id="t-lic" onclick="showTab('lic')">التراخيص (<span id="c-lic">0</span>)</button>
    </div>

    <div class="panel" id="p-dev">
      <table>
        <thead><tr><th>#</th><th>الجهاز</th><th>المعرّف</th><th>الحالة</th><th>إجراء</th></tr></thead>
        <tbody id="tb-dev"><tr><td colspan="5" style="text-align:center;color:#64748b">اضغط اتصال وتحديث لتحميل البيانات</td></tr></tbody>
      </table>
    </div>

    <div class="panel" id="p-lic" style="display:none">
      <table>
        <thead><tr><th>#</th><th>كود الترخيص</th><th>النوع</th><th>الحالة</th><th>إجراء</th></tr></thead>
        <tbody id="tb-lic"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <span>FATORA Support Control Tool v2.0</span>
    <span>مخصص للاستخدام الإداري فقط</span>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    function cfg() {
      return {
        base: $("base-url").value.replace(/\/+$/, ""),
        key: $("api-key").value.trim(),
      };
    }
    function showTab(t) {
      $("p-dev").style.display = t === "dev" ? "block" : "none";
      $("p-lic").style.display = t === "lic" ? "block" : "none";
      $("t-dev").classList.toggle("active", t === "dev");
      $("t-lic").classList.toggle("active", t === "lic");
    }
    async function loadData() {
      const { base, key } = cfg();
      $("status").textContent = "جاري الاتصال...";
      try {
        const res = await fetch(base + "/api/support/remote", { headers: { "x-support-key": key } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل الاتصال");
        $("status").textContent = "متصل ✓";
        const devs = data.devices || [];
        const lics = data.licenses || [];
        $("c-dev").textContent = devs.length;
        $("c-lic").textContent = lics.length;
        $("tb-dev").innerHTML = devs.map((d) => `
          <tr>
            <td>${d.id}</td>
            <td>${d.name || d.machineName || "-"}</td>
            <td dir="ltr">${d.machineId || d.fingerprint || "-"}</td>
            <td><span class="badge ${d.active ? "badge-on" : "badge-off"}">${d.active ? "مفعّل" : "موقوف"}</span></td>
            <td><button class="btn ${d.active ? "btn-red" : "btn-green"}" onclick="toggleItem('toggle-device', ${d.id}, ${!d.active})">${d.active ? "إيقاف" : "تفعيل"}</button></td>
          </tr>`).join("") || '<tr><td colspan="5" style="text-align:center">لا توجد أجهزة</td></tr>';
        $("tb-lic").innerHTML = lics.map((l) => `
          <tr>
            <td>${l.id}</td>
            <td dir="ltr">${l.key || l.code || "-"}</td>
            <td>${l.plan || "-"}</td>
            <td><span class="badge ${l.active ? "badge-on" : "badge-off"}">${l.active ? "نشط" : "معطّل"}</span></td>
            <td><button class="btn ${l.active ? "btn-red" : "btn-green"}" onclick="toggleItem('toggle-license', ${l.id}, ${!l.active})">${l.active ? "تعطيل" : "تفعيل"}</button></td>
          </tr>`).join("") || '<tr><td colspan="5" style="text-align:center">لا توجد تراخيص</td></tr>';
      } catch (e) {
        $("status").textContent = "خطأ: " + e.message;
      }
    }
    async function toggleItem(action, id, active) {
      const { base, key } = cfg();
      await fetch(base + "/api/support/remote", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-support-key": key },
        body: JSON.stringify({ action, id, active }),
      });
      loadData();
    }
  </script>
</body>
</html>
