<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      position: relative;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .splash-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* حاوية شريط تحميل ويندوز 11 في المساحة الفارغة أسفل النص */
    .win11-loader-box {
      position: absolute;
      top: 63%;
      left: 11%;
      width: 47%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loading-text {
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* مسار شريط التحميل الشبيه بويندوز 11 */
    .win11-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* المؤشر المتحرك المتمدد والمنكمش مثل ويندوز 11 */
    .win11-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #7dd3fc, #ffffff);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      animation: win11-indeterminate 1.8s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }

    @keyframes win11-indeterminate {
      0% {
        left: -35%;
        right: 100%;
      }

      60% {
        left: 100%;
        right: -90%;
      }

      100% {
        left: 100%;
        right: -90%;
      }
    }
  </style>
</head>

<body>
  <img src="./splash.png" class="splash-img" alt="FATORA" />

  <div class="win11-loader-box">
    <div class="loading-text">جاري تشغيل البرنامج...</div>
    <div class="win11-track">
      <div class="win11-bar"></div>
    </div>
  </div>
</body>

</html>
