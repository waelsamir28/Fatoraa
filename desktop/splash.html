<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* خلفية كحلي بدل الشفافية: لو الصورة مش موجودة تظهر شاشة واضحة لا شاشة فاضية */
      background: radial-gradient(circle at 50% 35%, #16548f 0%, #0f3a5f 45%, #081a2b 100%);
      user-select: none;
      position: relative;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    /* الصورة تغطي الشاشة بالكامل */
    #splash-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #splash-img.loaded {
      opacity: 1;
    }

    /* الشعار الاحتياطي: يظهر لو الصورة مش موجودة */
    #fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #fallback.show {
      display: flex;
    }

    #fallback-logo {
      max-width: 60%;
      max-height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
    }

    #fallback-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    #fallback-sub {
      font-size: 13px;
      font-weight: 700;
      color: #bfe3ff;
    }

    /* شريط تحميل ويندوز 11 */
    .win11-loader-box {
      position: absolute;
      bottom: 9%;
      left: 50%;
      transform: translateX(-50%);
      width: 46%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loading-text {
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .win11-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .win11-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #7dd3fc, #ffffff);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      animation: win11-indeterminate 1.8s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }

    @keyframes win11-indeterminate {
      0% {
        left: -35%;
        right: 100%;
      }

      60% {
        left: 100%;
        right: -90%;
      }

      100% {
        left: 100%;
        right: -90%;
      }
    }
  </style>
</head>

<body>
  <img id="splash-img" alt="FATORA" />

  <div id="fallback">
    <img id="fallback-logo" alt="FATORA" />
    <div id="fallback-title">FATORA</div>
    <div id="fallback-sub">برنامج إدارة المحلات التجارية</div>
  </div>

  <div class="win11-loader-box">
    <div class="loading-text">جاري تشغيل البرنامج...</div>
    <div class="win11-track">
      <div class="win11-bar"></div>
    </div>
  </div>

  <script>
    // نجرّب كل المسارات المحتملة للصورة (داخل الحزمة، أو resources، أو بجوار الملف)
    // لأن ملف واحد ناقص كان بيخلي شاشة البداية فاضية تماماً.
    var CANDIDATES = [
      "./splash.png",
      "./build/splash.png",
      "../splash.png",
      "../build/splash.png",
      "splash.png",
      "build/splash.png"
    ];

    var img = document.getElementById("splash-img");
    var fallback = document.getElementById("fallback");
    var fallbackLogo = document.getElementById("fallback-logo");
    var i = 0;

    function showFallback() {
      fallback.classList.add("show");
      // نفس مسارات الصورة للشعار الاحتياطي
      var logos = ["./build/logo-fatora.png", "./logo-fatora.png", "./build/icon.png", "./icon.png"];
      fallbackLogo.style.display = "none";
      (function tryLogo(k) {
        if (k >= logos.length) {
          fallbackLogo.style.display = "none";
          return;
        }
        var test = new Image();
        test.onload = function () {
          fallbackLogo.src = logos[k];
          fallbackLogo.style.display = "block";
        };
        test.onerror = function () {
          tryLogo(k + 1);
        };
        test.src = logos[k];
      })(0);
    }

    function tryNext() {
      if (i >= CANDIDATES.length) {
        showFallback();
        return;
      }
      var src = CANDIDATES[i++];
      img.onload = function () {
        img.classList.add("loaded");
        fallback.classList.remove("show");
      };
      img.onerror = tryNext;
      img.src = src;
    }

    tryNext();
  </script>
</body>

</html>
