<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* نفس اللون الكحلي بتاع الصورة — مفيش إطار أسود حوالين الشاشة */
      background: #0d3a63;
      user-select: none;
      position: relative;
      font-family: "Segoe UI", Tahoma, sans-serif;
      /* قص الحواف المستديرة للصورة وأي زيادة برّه النافذة */
      border-radius: 0;
    }

    /* طبقة تملأ النافذة بلون الصورة لمنع أي حدود سوداء */
    #bg-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #1268b3 0%, #0d3a63 55%, #082b4d 100%);
      z-index: 0;
    }

    /* الصورة تغطي الشاشة بالكامل */
    #splash-img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #splash-img.loaded {
      opacity: 1;
    }

    /* الشعار الاحتياطي: يظهر لو الصورة مش موجودة */
    #fallback {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #fallback.show {
      display: flex;
    }

    #fallback-logo {
      max-width: 60%;
      max-height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
    }

    #fallback-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    #fallback-sub {
      font-size: 13px;
      font-weight: 700;
      color: #bfe3ff;
    }

    /* شريط تحميل ويندوز 11 */
    .win11-loader-box {
      position: absolute;
      z-index: 3;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 46%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loading-text {
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      min-height: 18px;
      text-align: center;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .loading-text.fade-out {
      opacity: 0;
      transform: translateY(-4px);
    }

    /* تلميح متحرك: يلفّ نظرة سريعة على مزايا البرنامج */
    .loading-tip {
      color: #9fd4ff;
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      min-height: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    }

    .loading-tip.show {
      opacity: 1;
    }

    /* نقاط متحركة بعد الكلام */
    .dots span {
      animation: dot-blink 1.2s infinite;
      opacity: 0.25;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dot-blink {
      0%, 60%, 100% { opacity: 0.25; }
      30% { opacity: 1; }
    }

    .win11-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .win11-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #7dd3fc, #ffffff);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      animation: win11-indeterminate 1.8s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }

    @keyframes win11-indeterminate {
      0% {
        left: -35%;
        right: 100%;
      }

      60% {
        left: 100%;
        right: -90%;
      }

      100% {
        left: 100%;
        right: -90%;
      }
    }
  </style>
</head>

<body>
  <div id="bg-fill"></div>
  <img id="splash-img" alt="FATORA" />

  <div id="fallback">
    <img id="fallback-logo" alt="FATORA" />
    <div id="fallback-title">FATORA</div>
    <div id="fallback-sub">برنامج إدارة المحلات التجارية</div>
  </div>

  <div class="win11-loader-box">
    <div class="loading-text" id="loadingText">
      جاري تشغيل البرنامج<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div class="win11-track">
      <div class="win11-bar"></div>
    </div>
    <div class="loading-tip" id="loadingTip"></div>
  </div>

  <script>
    /**
     * كلام متحرك أسفل شريط التحميل:
     *  - جملة الحالة تتغير كل 3.2 ثانية (ونقاط متحركة عشان تبان شغالة)
     *  - تلميح عن ميزة من مزايا البرنامج يتغير كل 4.5 ثانية
     * الهدف: من يثبّت/يشغّل البرنامج ما يحسّش إنه معلّق.
     */
    (function () {
      var statuses = [
        "جاري تشغيل البرنامج",
        "جاري تحميل بيانات المتجر",
        "جاري فتح قاعدة البيانات",
        "جاري تحضير شاشة البيع",
        "لحظات قليلة من فضلك"
      ];
      var tips = [
        "نصيحة: اربط البرنامج بالسحابة لأخذ نسخة احتياطية تلقائية كل يوم",
        "نصيحة: اضغط F6 لفتح فاتورة مبيعات جديدة بسرعة",
        "نصيحة: يمكنك مسح الباركود بكاميرا الموبايل من شاشة البيع",
        "نصيحة: تقرير Z يقفل الوردية ويحسب الفرق في الخزينة",
        "نصيحة: الدعم الفني م/ وائل الجمال — 01222355769 — نسعد بخدمتك",
        "نصيحة: اضغط Ctrl+K للبحث السريع في كل شاشات البرنامج"
      ];
      var textEl = document.getElementById("loadingText");
      var tipEl = document.getElementById("loadingTip");
      var si = 0;
      var ti = 0;

      if (textEl) {
        setInterval(function () {
          si = (si + 1) % statuses.length;
          textEl.classList.add("fade-out");
          setTimeout(function () {
            textEl.innerHTML = statuses[si] + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
            textEl.classList.remove("fade-out");
          }, 220);
        }, 3200);
      }

      if (tipEl) {
        function nextTip() {
          tipEl.classList.remove("show");
          setTimeout(function () {
            tipEl.textContent = tips[ti % tips.length];
            ti++;
            tipEl.classList.add("show");
          }, 320);
        }
        nextTip();
        setInterval(nextTip, 4500);
      }
    })();

    // نجرّب كل المسارات المحتملة للصورة (داخل الحزمة، أو resources، أو بجوار الملف)
    // لأن ملف واحد ناقص كان بيخلي شاشة البداية فاضية تماماً.
    var CANDIDATES = [
      "./splash.png",
      "./build/splash.png",
      "../splash.png",
      "../build/splash.png",
      "splash.png",
      "build/splash.png"
    ];

    var img = document.getElementById("splash-img");
    var fallback = document.getElementById("fallback");
    var fallbackLogo = document.getElementById("fallback-logo");
    var i = 0;

    function showFallback() {
      fallback.classList.add("show");
      // نفس مسارات الصورة للشعار الاحتياطي
      var logos = ["./build/logo-fatora.png", "./logo-fatora.png", "./build/icon.png", "./icon.png"];
      fallbackLogo.style.display = "none";
      (function tryLogo(k) {
        if (k >= logos.length) {
          fallbackLogo.style.display = "none";
          return;
        }
        var test = new Image();
        test.onload = function () {
          fallbackLogo.src = logos[k];
          fallbackLogo.style.display = "block";
        };
        test.onerror = function () {
          tryLogo(k + 1);
        };
        test.src = logos[k];
      })(0);
    }

    function tryNext() {
      if (i >= CANDIDATES.length) {
        showFallback();
        return;
      }
      var src = CANDIDATES[i++];
      img.onload = function () {
        img.classList.add("loaded");
        fallback.classList.remove("show");
      };
      img.onerror = tryNext;
      img.src = src;
    }

    tryNext();
  </script>
</body>

</html>
