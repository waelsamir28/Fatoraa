name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install desktop tooling (Electron)
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build برنامج FATORA (Setup + Portable EXE)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        run: npm run dist:local

      - name: Build + publish (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # تحديث التلقائي يحتاج أن تكون النسخة موقّعة/مطابقة لرقم الوسم
          EP_GH_IGNORE_TIME: "true"
        run: npm run dist

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Fatora-Windows-EXE
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
